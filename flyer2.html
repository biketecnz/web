<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://www.biketec.org.nz" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Biketec - Specialists in bikes for schools</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Base */
    :root {
      --bg-dark: #29221fff;   /* original 8-digit hex with alpha */
      --bg-brown: #312824ff;
      --bg-green: #203715ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "Poppins", sans-serif;
    }

    /* Table scaffold (kept on purpose to preserve original layout) */
    .main-table {
      width: 100%;
      max-width: 1900px;
      border-collapse: collapse;
      table-layout: fixed;
      margin: 0 auto;
    }
    .main-table td {
      vertical-align: top;
      position: relative;
      border: 1px solid #333; /* matches the original subtle grid */
    }

    /* Header band */
    .row-header { background: var(--bg-dark); }
    .header-nested {
      width: 100%;
      background: var(--bg-dark);
      border-collapse: collapse;
      border: none;
    }
    .header-title {
      color: #fff;
      font-weight: 800;
      text-align: center;
      padding: 20px 30px 0 20px;
      font-size: 18px;
      margin: 0;
    }

    /* Intro band */
    .row-intro { background: var(--bg-dark); }
    .intro-box {
      width: 1200px;
      margin: 0 auto;
      background: var(--bg-dark);
      border-collapse: collapse;
      border: none;
    }
    .intro-text {
      font-weight: 300;
      text-align: center;
      padding: 25px 65px;
      font-size: 28px;
    }

    /* Split rows */
    .row-mission { background: var(--bg-brown); }
    .row-subscription { background: var(--bg-green); }

    .split-left, .split-right {
      width: 50%;
    }
    .pad-wide {
      color: #fff;
      font-weight: 200;
      text-align: left;
      padding: 200px 40px 200px 80px; /* matches original generous spacing */
      font-size: 18px;
    }

    /* Images should take the cell width and keep aspect ratio */
    td.image-cell { padding: 0; }
    td.image-cell img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Subscription content */
    .subscription h3 {
      font-size: 20px;
      font-weight: 600;
      margin: 30px 0 15px;
      color: #fff;
    }
    .subscription ul {
      list-style: disc;
      margin: 0 0 20px 25px;
      padding: 0;
    }
    .subscription li {
      margin-bottom: 10px;
      line-height: 1.5;
      color: #fff;
      font-size: 18px;
      font-weight: 200;
    }
    .subscription p {
      line-height: 1.6;
      margin-top: 20px;
      color: #fff;
      font-size: 18px;
      font-weight: 200;
    }

    /* Advice band */
    .row-advice { background: var(--bg-dark); }
    .advice-box {
      width: 900px;
      margin: 0 auto;
      background: var(--bg-dark);
      border-collapse: collapse;
      border: none;
    }
    .advice-text {
      font-weight: 300;
      text-align: left;
      padding: 25px 65px;
      font-size: 20px;
    }

    /* Footer band */
    .row-footer { background: var(--bg-dark); }
    .footer-title {
      color: #fff;
      font-weight: 800;
      text-align: center;
      padding: 20px;
      font-size: 18px;
      margin: 0;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .split-left, .split-right { display: block; width: 100%; }
      .pad-wide { padding: 24px; }
      .intro-text { padding: 20px; font-size: 22px; }
      .advice-text { padding: 20px; font-size: 18px; }
    }
  </style>
</head>
