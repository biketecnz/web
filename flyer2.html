<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://www.biketec.org.nz" />
  <meta charset="UTF-8">
  <title>Biketec - Specialists in bikes for schools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }

    .main-table {
      width: 100%;
      max-width: 1900px;
      border-collapse: collapse;
      margin: 0;
      padding: 0;
    }

    .main-table td {
      vertical-align: top;
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .header-nested {
      background-color: #29221f;
      width: 100%;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .header-nested h1 {
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      margin: 0;
    }

    /* Intro section */
    .intro {
      width: 1200px;
      margin: 0 auto;
      background: #29221f;
      font-weight: 300;
      text-align: center;
      padding: 25px 65px;
      font-size: 28px;
    }

    /* Split layout */
    .split-left,
    .split-right {
      width: 50%;
      box-sizing: border-box;
      vertical-align: top;
      padding: 40px 80px;
    }

    .split-left img,
    .split-right img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Subscription content */
    .subscription h3 {
      font-size: 20px;
      font-weight: 600;
      margin: 30px 0 15px;
      color: #fff;
    }

    .subscription ul {
      list-style-type: disc;
      margin-left: 25px;
      margin-bottom: 20px;
    }

    .subscription li {
      margin-bottom: 10px;
      line-height: 1.5;
      color: #fff;
      font-size: 18px;
      font-weight: 200;
    }

    .subscription p {
      line-height: 1.6;
      margin-top: 20px;
      color: #fff;
      font-size: 18px;
      font-weight: 200;
    }

    /* Advice section */
    .advice {
      width: 900px;
      margin: 0 auto;
      background: #29221f;
      font-weight: 300;
      text-align: left;
      padding: 25px 65px;
      font-size: 20px;
    }

    /* Footer */
    .footer {
      background-color: #29221f;
      text-align: center;
      padding: 20px;
    }

    .footer h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin: 0;
    }

    /* Media responsiveness */
    @media screen and (max-width: 768px) {
      .main-table,
      .main-table tbody,
      .main-table tr,
      .main-table td {
        display: block;
        width: 100% !important;
        height: auto;
      }
      .split-left,
      .split-right {
        width: 100%;
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <table class="main-table">
    <!-- Header -->
    <tr>
      <td colspan="2">
        <div class="header-nested">
          <h1>Biketec - Specialists in bikes for schools</h1>
        </div>
      </td>
    </tr>

    <!-- Intro -->
    <tr>
      <td colspan="2">
